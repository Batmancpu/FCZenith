<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Canvas</title>
<style>
  :root { color-scheme: dark; --bg: #0f0f12; --card: #1a1a20; --line: #2c2c35; --text: #f2f2f5; --muted: #9a9aa8; --accent: #fa586a; --ok: #4cc38a; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 10px 16px; border-radius: 10px; cursor: pointer; }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  label { display: block; margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  ul { list-style: none; padding: 0; margin: 0 0 12px; font-size: 14px; }
  li.ok { color: var(--ok); }
  li.bad { color: var(--bad); }
  .note { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card video { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: #000; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Zenith Canvas</h1>
  <p class="sub">Upload canvas lagu dan pilih yang terbaik.</p>
  <nav>
    <button id="tabUpload" class="on">Upload</button>
    <button id="tabBrowse">Jelajah</button>
  </nav>

  <section id="upload">
    <label>Judul lagu<input id="song" placeholder="Persis seperti di app"></label>
    <label>Artis<input id="artist"></label>
    <label>Album (kosongkan kalau ragu)<input id="album"></label>
    <label>Video canvas (MP4)<input id="file" type="file" accept="video/mp4"></label>
    <ul id="checks"></ul>
    <button id="send" class="primary" disabled>Kirim</button>
    <p id="status" class="note"></p>
    <p class="note">Aturan: MP4 H.264 tanpa audio, 1280x1280, 3 sampai 8 detik, maksimal 3 MB. Canvas tampil setelah disetujui admin.</p>
  </section>

  <section id="browse" hidden>
    <label>Judul lagu<input id="qSong"></label>
    <label>Artis<input id="qArtist"></label>
    <button id="find" class="primary">Cari</button>
    <p id="findStatus" class="note"></p>
    <div id="results"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, setDoc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCO8txNS4UPwjrRKplPenuL-RA557gGhco",
  authDomain: "zenith-canvas-17133.firebaseapp.com",
  projectId: "zenith-canvas-17133",
  storageBucket: "zenith-canvas-17133.firebasestorage.app",
  messagingSenderId: "992141009224",
  appId: "1:992141009224:web:6f27b1b2e2dd9cdeb5937d"
};
const SUPABASE_URL = "https://ljckgisqhlypvszlckvf.supabase.co";
const SUPABASE_KEY = "sb_publishable_FYDrANBKImrFKNoYpQI0MQ_MqMA-Jhr";
const RULES = { width: 1280, height: 1280, minSec: 3, maxSec: 8, maxBytes: 3 * 1024 * 1024 };

const db = getFirestore(initializeApp(FIREBASE_CONFIG));
const $ = (id) => document.getElementById(id);

function deviceId() {
  let id = localStorage.getItem("zc_device");
  if (!id) { id = crypto.randomUUID(); localStorage.setItem("zc_device", id); }
  return id;
}

function liked() {
  try { return JSON.parse(localStorage.getItem("zc_liked") || "[]"); } catch (e) { return []; }
}

function norm(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function show(tab) {
  $("upload").hidden = tab !== "upload";
  $("browse").hidden = tab !== "browse";
  $("tabUpload").className = tab === "upload" ? "on" : "";
  $("tabBrowse").className = tab === "browse" ? "on" : "";
}
$("tabUpload").onclick = () => show("upload");
$("tabBrowse").onclick = () => show("browse");

function inspect(file) {
  return new Promise((resolve) => {
    const video = document.createElement("video");
    const objectUrl = URL.createObjectURL(file);
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      URL.revokeObjectURL(objectUrl);
      resolve({ width: video.videoWidth, height: video.videoHeight, duration: Math.round(video.duration * 10) / 10, size: file.size });
    };
    video.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(null); };
    video.src = objectUrl;
  });
}

async function uploadVideo(file) {
  const name = crypto.randomUUID() + ".mp4";
  const endpoint = SUPABASE_URL + "/storage/v1/object/canvas/" + name;
  const attempt = (withBearer) => {
    const headers = { apikey: SUPABASE_KEY, "Content-Type": "video/mp4" };
    if (withBearer) headers.Authorization = "Bearer " + SUPABASE_KEY;
    return fetch(endpoint, { method: "POST", headers, body: file });
  };
  let res = await attempt(false);
  if (!res.ok && [400, 401, 403].includes(res.status)) res = await attempt(true);
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (e) {}
    throw new Error("upload gagal (" + res.status + ") " + detail);
  }
  return SUPABASE_URL + "/storage/v1/object/public/canvas/" + name;
}

let picked = null;

$("file").onchange = async () => {
  const file = $("file").files[0];
  const list = $("checks");
  list.innerHTML = "";
  picked = null;
  $("send").disabled = true;
  if (!file) return;
  const meta = await inspect(file);
  if (!meta) {
    const li = document.createElement("li");
    li.className = "bad";
    li.textContent = "Video tidak bisa dibaca";
    list.appendChild(li);
    return;
  }
  const checks = [
    ["Format MP4", file.type === "video/mp4"],
    ["Ukuran " + meta.width + "x" + meta.height + " (harus 1280x1280)", meta.width === RULES.width && meta.height === RULES.height],
    ["Durasi " + meta.duration + " detik (3 sampai 8)", meta.duration >= RULES.minSec && meta.duration <= RULES.maxSec],
    ["File " + (meta.size / 1048576).toFixed(2) + " MB (maksimal 3 MB)", meta.size <= RULES.maxBytes]
  ];
  let allOk = true;
  for (const [label, ok] of checks) {
    const li = document.createElement("li");
    li.className = ok ? "ok" : "bad";
    li.textContent = (ok ? "OK  " : "Gagal  ") + label;
    list.appendChild(li);
    if (!ok) allOk = false;
  }
  if (allOk) { picked = { file, meta }; $("send").disabled = false; }
};

$("send").onclick = async () => {
  const song = $("song").value.trim();
  const artist = $("artist").value.trim();
  const album = $("album").value.trim();
  if (!song || !artist) { $("status").textContent = "Isi judul lagu dan artis dulu."; return; }
  if (!picked) return;
  $("send").disabled = true;
  $("status").textContent = "Mengunggah...";
  try {
    const url = await uploadVideo(picked.file);
    await addDoc(collection(db, "canvases"), {
      song, artist, album,
      key: norm(song) + "|" + norm(artist),
      url,
      status: "pending",
      likes: 0,
      createdAt: serverTimestamp(),
      size: picked.meta.size,
      duration: picked.meta.duration,
      width: picked.meta.width,
      height: picked.meta.height,
      specVersion: 1
    });
    $("status").textContent = "Terkirim. Menunggu persetujuan admin.";
    $("file").value = "";
    $("checks").innerHTML = "";
    picked = null;
  } catch (error) {
    $("status").textContent = "Gagal: " + error.message;
    $("send").disabled = false;
  }
};

function card(id, data) {
  const box = document.createElement("div");
  box.className = "card";
  const video = document.createElement("video");
  video.src = data.url;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.controls = true;
  video.preload = "metadata";
  const row = document.createElement("div");
  row.className = "row";
  const count = document.createElement("span");
  count.textContent = (data.likes || 0) + " like";
  const button = document.createElement("button");
  const already = liked().includes(id);
  button.textContent = already ? "Sudah di-like" : "Like";
  button.disabled = already;
  button.onclick = async () => {
    button.disabled = true;
    try {
      await setDoc(doc(db, "votes", deviceId() + "_" + id), { canvasId: id, at: serverTimestamp() });
    } catch (error) {
      button.textContent = "Sudah di-like";
      return;
    }
    try {
      await updateDoc(doc(db, "canvases", id), { likes: increment(1) });
      data.likes = (data.likes || 0) + 1;
      count.textContent = data.likes + " like";
      localStorage.setItem("zc_liked", JSON.stringify([...liked(), id]));
      button.textContent = "Sudah di-like";
    } catch (error) {
      button.textContent = "Gagal, coba lagi";
      button.disabled = false;
    }
  };
  row.append(count, button);
  box.append(video, row);
  return box;
}

$("find").onclick = async () => {
  const song = $("qSong").value.trim();
  const artist = $("qArtist").value.trim();
  const results = $("results");
  results.innerHTML = "";
  if (!song || !artist) { $("findStatus").textContent = "Isi judul lagu dan artis."; return; }
  $("findStatus").textContent = "Mencari...";
  try {
    const snap = await getDocs(query(
      collection(db, "canvases"),
      where("status", "==", "approved"),
      where("key", "==", norm(song) + "|" + norm(artist))
    ));
    const items = snap.docs.map((d) => ({ id: d.id, data: d.data() }));
    items.sort((a, b) => (b.data.likes || 0) - (a.data.likes || 0));
    $("findStatus").textContent = items.length ? items.length + " canvas ditemukan, yang teratas dipakai app." : "Belum ada canvas untuk lagu ini.";
    for (const item of items) results.appendChild(card(item.id, item.data));
  } catch (error) {
    $("findStatus").textContent = "Gagal memuat: " + error.message;
  }
};
</script>
</body>
</html>
