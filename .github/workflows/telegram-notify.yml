name: Telegram Notify

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -eu
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          NL=$'\n'
          R=$(esc "$REPO")
          A=$(esc "$ACTOR")

          case "$EVENT" in
            issues)
              T=$(esc "$ISSUE_TITLE")
              AU=$(esc "$ISSUE_AUTHOR")
              L=$(esc "${ISSUE_LABELS:-none}")
              MSG="<b>Issue ${ACTION}</b>${NL}<code>${R}</code>${NL}${NL}<b>#${ISSUE_NUM}</b> <a href=\"${ISSUE_URL}\">${T}</a>${NL}${NL}<b>State:</b> ${ISSUE_STATE^^}${NL}<b>Author:</b> ${AU}${NL}<b>Labels:</b> ${L}${NL}<b>By:</b> ${A}"
              ;;
            issue_comment)
              T=$(esc "$ISSUE_TITLE")
              BODY="${COMMENT_BODY:0:300}"
              if [ "${#COMMENT_BODY}" -gt 300 ]; then BODY="${BODY}…"; fi
              BODY=$(esc "$BODY")
              MSG="<b>New comment</b>${NL}<code>${R}</code>${NL}${NL}<b>#${ISSUE_NUM}</b> <a href=\"${COMMENT_URL}\">${T}</a>${NL}<b>By:</b> ${A}${NL}${NL}<blockquote>${BODY}</blockquote>"
              ;;
            pull_request)
              T=$(esc "$PR_TITLE")
              AU=$(esc "$PR_AUTHOR")
              STATE="$PR_STATE"
              TITLE_ACTION="$ACTION"
              if [ "$PR_MERGED" = "true" ]; then
                STATE="merged"; TITLE_ACTION="merged"
              fi
              MSG="<b>Pull request ${TITLE_ACTION}</b>${NL}<code>${R}</code>${NL}${NL}<b>#${PR_NUM}</b> <a href=\"${PR_URL}\">${T}</a>${NL}${NL}<b>State:</b> ${STATE^^}${NL}<b>Author:</b> ${AU}${NL}<b>By:</b> ${A}"
              ;;
            push)
              COMMIT_COUNT=$(jq '.commits | length' "$GITHUB_EVENT_PATH" 2>/dev/null || echo 0)
              FIRST_LINE=$(esc "${HEAD_MSG%%$'\n'*}")
              BR=$(esc "$REF_NAME")
              MSG="<b>New push</b> to <code>${BR}</code>${NL}<code>${R}</code>${NL}${NL}<blockquote>${FIRST_LINE}</blockquote>${NL}<b>By:</b> ${A}${NL}<b>Commits:</b> ${COMMIT_COUNT}${NL}<a href=\"${COMPARE_URL}\">View changes</a>"
              ;;
            release)
              RT=$(esc "$RELEASE_TAG")
              RN=$(esc "$RELEASE_NAME")
              MSG="<b>New release</b>${NL}<code>${R}</code>${NL}${NL}<a href=\"${RELEASE_URL}\">${RT} ${RN}</a>${NL}<b>By:</b> ${A}"
              ;;
            *)
              MSG="<b>${EVENT}</b> ${ACTION}${NL}<code>${R}</code>${NL}<b>By:</b> ${A}"
              ;;
          esac

          ARGS=(
            --data-urlencode "chat_id=${TG_CHAT_ID}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "disable_web_page_preview=true"
            --data-urlencode "text=${MSG}"
          )
          if [ -n "${TG_TOPIC_ID:-}" ]; then
            ARGS+=(--data-urlencode "message_thread_id=${TG_TOPIC_ID}")
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${ARGS[@]}"
