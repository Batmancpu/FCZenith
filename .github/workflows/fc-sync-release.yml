name: FC Zenith — upstream sync and Music release

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fczenith-main-sync-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout FCZenith main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retire a delivered one-shot overlay if cleanup was interrupted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="fc/one-shot/spatial-audio/target-version"
          if [[ -f "$marker" ]]; then
            target="$(tr -d '[:space:]' < "$marker")"
            asset="Music-v${target}.apk"
            assets="$(gh release view "v${target}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if grep -Fxq "$asset" <<< "$assets"; then
              echo "Target APK already published; completing one-shot source cleanup."
              rm -rf fc/one-shot/spatial-audio
              rm -f app/src/main/java/com/music/zenith/playback/SpatialAudioPreference.kt
              rm -f app/src/test/java/com/music/zenith/playback/SpatialAudioPreferenceTest.kt
              git add -A fc/one-shot/spatial-audio app/src/main/java/com/music/zenith/playback/SpatialAudioPreference.kt app/src/test/java/com/music/zenith/playback/SpatialAudioPreferenceTest.kt
              git commit -m "chore(fc): retire delivered one-shot Spatial Audio learner"
              git push origin HEAD:main
            fi
          fi

      - name: Fetch upstream source and latest stable release metadata
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/rezapranata089-bit/Zenith.git
          BASE_SHA="$(git rev-parse HEAD)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          TAG="$(gh api repos/rezapranata089-bit/Zenith/releases/latest --jq '.tag_name')"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected upstream stable release tag: $TAG" >&2
            exit 1
          fi

          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream/$TAG"
          STABLE_TARGET="refs/tags/upstream/$TAG^{commit}"
          TRACK_MODE="$(sed -n 's/^upstreamTrack=//p' fc/version.properties)"
          TRACK_MODE="${TRACK_MODE:-stable}"

          case "$TRACK_MODE" in
            stable)
              TARGET="$STABLE_TARGET"
              SOURCE_REF="stable:$TAG"
              COMMITS_AHEAD=0
              ;;
            main-once)
              PIN="$(sed -n 's/^upstreamCommit=//p' fc/version.properties)"
              if [[ ! "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
                echo "main-once mode requires a full upstreamCommit SHA in fc/version.properties." >&2
                exit 1
              fi
              git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
              if ! git cat-file -e "$PIN^{commit}" 2>/dev/null; then
                echo "Pinned upstream main commit is unavailable: $PIN" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$PIN" refs/remotes/upstream/main; then
                echo "Pinned upstream commit is no longer on upstream main; refusing an unreviewed snapshot." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$STABLE_TARGET" "$PIN"; then
                echo "Pinned upstream main commit does not contain the latest stable release $TAG." >&2
                exit 1
              fi
              TARGET="$PIN"
              SOURCE_REF="main"
              COMMITS_AHEAD="$(git rev-list --count "$STABLE_TARGET..$PIN")"
              if [[ "$COMMITS_AHEAD" -lt 1 ]]; then
                echo "Pinned upstream main snapshot contains no commits beyond $TAG." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported upstreamTrack mode: $TRACK_MODE" >&2
              exit 1
              ;;
          esac

          TARGET_SHA="$(git rev-parse "$TARGET^{commit}")"
          if git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream target $TARGET_SHA is already in FCZenith main."
          else
            # Keep FC-owned workflow files, but never hide conflicts in app source.
            if ! git merge --no-edit --no-ff "$TARGET_SHA"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$conflicts" ]] || grep -qv '^.github/workflows/' <<< "$conflicts"; then
                echo "Upstream merge has conflicts outside FC-owned workflows; stopping safely." >&2
                git merge --abort
                exit 1
              fi

              git checkout "$BASE_SHA" -- .github/workflows
              git add -A .github/workflows
              remaining="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$remaining" ]]; then
                echo "Workflow conflict could not be resolved safely:" >&2
                echo "$remaining" >&2
                git merge --abort
                exit 1
              fi
              git commit --no-edit
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream $SOURCE_REF at $TARGET_SHA."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "commits_ahead=$COMMITS_AHEAD" >> "$GITHUB_OUTPUT"
          echo "Upstream source: $SOURCE_REF ($TARGET_SHA), $COMMITS_AHEAD commits beyond stable $TAG."
 
      - name: Preserve FCZenith-owned GitHub Actions workflows
        run: |
          set -euo pipefail
          # The app source follows the selected stable tag or pinned main snapshot;
          # CI/CD ownership stays with FCZenith. Do not import upstream workflows.
          git rm -r --ignore-unmatch .github/workflows
          git checkout "${{ steps.upstream.outputs.base_sha }}" -- .github/workflows

      - name: Decide whether a release is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_UPSTREAM_VERSION="$(sed -n 's/^upstreamVersion=//p' fc/version.properties)"
          VERSION_NAME="$(sed -n 's/^versionName=//p' fc/version.properties)"
          if [[ -z "$CURRENT_UPSTREAM_VERSION" || -z "$VERSION_NAME" ]]; then
            echo "Missing FC upstreamVersion/versionName metadata." >&2
            exit 1
          fi

          release_asset="Music-v${VERSION_NAME}.apk"
          release_assets="$(gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)"
          release_asset_exists=false
          if grep -Fxq "$release_asset" <<< "$release_assets"; then
            release_asset_exists=true
          fi

          if [[ "$UPSTREAM_VERSION" != "$CURRENT_UPSTREAM_VERSION" ]]; then
            # The parent published a new stable version. Start its FC sequence at .1.
            python3 fc/bump-version.py "$UPSTREAM_VERSION"
            should_release=true
          elif [[ "$release_asset_exists" == "false" ]]; then
            # Also recover automatically if a previous run created the release but missed its APK.
            should_release=true
          else
            should_release=false
          fi

          VERSION_CODE="$(sed -n 's/^versionCode=//p' fc/version.properties)"
          VERSION_NAME="$(sed -n 's/^versionName=//p' fc/version.properties)"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "FC release decision: $should_release ($VERSION_NAME / $VERSION_CODE), upstream $UPSTREAM_VERSION"

      - name: Set up JDK 17
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ccache
        if: steps.decision.outputs.should_release == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache
          ccache --version | head -n1

      - name: Cache ccache
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: fc-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fc-ccache-${{ runner.os }}-

      - name: Cache Android CMake and NDK
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: fc-android-sdk-cmake3.22.1-ndk27.0.12077973

      - name: Install CMake and NDK
        if: steps.decision.outputs.should_release == 'true'
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        if: steps.decision.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing password is configured
        if: steps.decision.outputs.should_release == 'true'
        env:
          FC_SIGNING_KEY_PASSWORD: ${{ secrets.FC_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FC_SIGNING_KEY_PASSWORD" ]]; then
            echo "Missing repository Actions secret: FC_SIGNING_KEY_PASSWORD." >&2
            exit 1
          fi

      - name: Install icon-resizing dependency
        if: steps.decision.outputs.should_release == 'true'
        run: python3 -m pip install --user Pillow

      - name: Apply FC identity and launcher overlay
        if: steps.decision.outputs.should_release == 'true'
        env:
          FC_VERSION_CODE: ${{ steps.decision.outputs.version_code }}
          FC_VERSION_NAME: ${{ steps.decision.outputs.version_name }}
        run: python3 fc/apply-overlay.py

      - name: Apply the one-release Spatial Audio learner and phone-speaker safeguard
        if: steps.decision.outputs.should_release == 'true'
        env:
          FC_VERSION_NAME: ${{ steps.decision.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          overlay="fc/one-shot/spatial-audio"
          if [[ -d "$overlay" ]]; then
            target="$(tr -d '[:space:]' < "$overlay/target-version")"
            if [[ "$FC_VERSION_NAME" != "$target" ]]; then
              echo "One-shot Spatial Audio overlay is pinned to $target, not $FC_VERSION_NAME; refusing to build it into another release." >&2
              exit 1
            fi
            python3 "$overlay/apply.py"
          fi

      - name: Fill missing Android locale fallbacks for this build
        if: steps.decision.outputs.should_release == 'true'
        run: |
          python3 - <<'PY'
          import copy
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base_path = Path("app/src/main/res/values/strings.xml")
          base_root = ET.parse(base_path).getroot()
          supported = {"string", "plurals", "string-array"}
          base_entries = {}
          for element in list(base_root):
              name = element.attrib.get("name")
              if (element.tag in supported and name
                      and element.attrib.get("translatable") != "false"):
                  if name in base_entries:
                      raise SystemExit(f"Duplicate base Android resource: {name}")
                  base_entries[name] = element

          for qualifier in ("values-in", "values-ko"):
              locale_path = Path("app/src/main/res") / qualifier / "strings.xml"
              locale_tree = ET.parse(locale_path)
              locale_root = locale_tree.getroot()
              locale_entries = {}
              for element in list(locale_root):
                  name = element.attrib.get("name")
                  if element.tag in supported and name:
                      locale_entries.setdefault(name, []).append(element)

              added = 0
              for name, base_element in base_entries.items():
                  existing = locale_entries.get(name, [])
                  if any(item.attrib.get("translatable") != "false" for item in existing):
                      continue

                  # Replace a locale-specific translatable=false placeholder if one
                  # exists; otherwise append the same English fallback Android
                  # would resolve at runtime. Existing translations are untouched.
                  for item in existing:
                      locale_root.remove(item)
                  locale_root.append(copy.deepcopy(base_element))
                  added += 1

              if added:
                  locale_tree.write(locale_path, encoding="utf-8", xml_declaration=True)
                  ET.parse(locale_path)  # Fail here if generated XML is malformed.
              print(f"{qualifier}: added {added} English fallback entries for this build.")
          PY

      - name: Run production unit tests
        if: steps.decision.outputs.should_release == 'true'
        env:
          FC_VERSION_CODE: ${{ steps.decision.outputs.version_code }}
          FC_VERSION_NAME: ${{ steps.decision.outputs.version_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          ./gradlew :app:testProdReleaseUnitTest --no-daemon --stacktrace

      - name: Build the Music production APK before signing
        if: steps.decision.outputs.should_release == 'true'
        env:
          FC_VERSION_CODE: ${{ steps.decision.outputs.version_code }}
          FC_VERSION_NAME: ${{ steps.decision.outputs.version_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease --parallel --build-cache --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Validate and sign the production APK
        if: steps.decision.outputs.should_release == 'true'
        env:
          EXPECTED_VERSION_CODE: ${{ steps.decision.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.decision.outputs.version_name }}
          FC_SIGNING_KEY_PASSWORD: ${{ secrets.FC_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK_COUNT="$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "$APK_COUNT" != "1" ]]; then
            echo "Expected exactly one production APK, found $APK_COUNT" >&2
            find app/build/outputs/apk/prod/release -maxdepth 1 -type f -print
            exit 1
          fi
          APK="$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          BUILD_TOOLS="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # Check package and version before signing.
          "$AAPT" dump badging "$APK" > /tmp/fc-badging.txt
          grep -F "package: name='com.spotify.music' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" /tmp/fc-badging.txt

          # Generate the key only after Gradle has finished. The upstream build
          # scripts never receive the signing password or an unlocked keystore.
          KEYSTORE="fc/signing-key.p12"
          if [[ ! -f "$KEYSTORE" ]]; then
            echo "Generating the permanent FC release key."
            keytool -genkeypair -v \
              -alias fczenith \
              -keyalg RSA -keysize 4096 \
              -validity 10000 \
              -dname "CN=FC Zenith Release" \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$FC_SIGNING_KEY_PASSWORD" \
              -keypass "$FC_SIGNING_KEY_PASSWORD"
          else
            echo "Reusing the existing FC release key."
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$FC_SIGNING_KEY_PASSWORD" \
            -alias fczenith >/dev/null

          mkdir -p dist
          SIGNED_APK="dist/Music-v${EXPECTED_VERSION_NAME}.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias fczenith \
            --ks-pass env:FC_SIGNING_KEY_PASSWORD \
            --key-pass env:FC_SIGNING_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" > /tmp/fc-signature.txt 2>&1
          FINGERPRINT="$(awk '/certificate SHA-256 digest:/ {value=$NF; gsub(":", "", value); print tolower(value); exit}' /tmp/fc-signature.txt)"
          if [[ ! "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not read APK signing certificate SHA-256 fingerprint" >&2
            cat /tmp/fc-signature.txt
            exit 1
          fi
          if [[ -f fc/signing-cert-sha256.txt ]]; then
            EXPECTED_FINGERPRINT="$(tr -d '[:space:]' < fc/signing-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
            if [[ "$FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
              echo "Signing certificate changed; refusing to publish an update that Android may reject." >&2
              exit 1
            fi
          else
            printf '%s\n' "$FINGERPRINT" > fc/signing-cert-sha256.txt
          fi

          echo "sha256=$(sha256sum "$SIGNED_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "Verified package, version and permanent signing certificate: $FINGERPRINT"

      - name: Remove temporary identity overlay from source checkout
        if: steps.decision.outputs.should_release == 'true' && always()
        run: |
          git restore --worktree -- app/build.gradle.kts build.gradle.kts app/src/main/res/drawable/ic_notification_logo.xml app/src/main/res/drawable/ic_launcher_background.xml app/src/main/res/drawable/ic_launcher_foreground.xml \
            app/src/main/res/mipmap-mdpi/ic_launcher.webp app/src/main/res/mipmap-mdpi/ic_launcher_round.webp \
            app/src/main/res/mipmap-hdpi/ic_launcher.webp app/src/main/res/mipmap-hdpi/ic_launcher_round.webp \
            app/src/main/res/mipmap-xhdpi/ic_launcher.webp app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.webp app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp
          rm -f app/src/main/res/drawable-nodpi/fc_music_icon.webp

      - name: Restore one-shot app changes to the upstream source
        if: steps.decision.outputs.should_release == 'true' && always()
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          restore_paths=(
            app/src/main/java/com/music/zenith/MainActivity.kt
            app/src/main/java/com/music/zenith/data/settings/AppSettings.kt
            app/src/main/java/com/music/zenith/playback/PlaybackService.kt
            app/src/main/java/com/music/zenith/playback/SpatialAudioProcessor.kt
            app/src/main/java/com/music/zenith/ui/components/SongActionsMenu.kt
            app/src/main/java/com/music/zenith/ui/screens/SettingsSheet.kt
            app/src/main/res/values/strings.xml
            app/src/main/res/values-in/strings.xml
            app/src/main/res/values-ko/strings.xml
            app/src/main/java/com/music/zenith/playback/SpatialAudioLearning.kt
            app/src/main/java/com/music/zenith/playback/SpatialAudioPreference.kt
            app/src/main/java/com/music/zenith/playback/SpatialAudioDecisionEngine.kt
            app/src/main/java/com/music/zenith/TopBarActionVisibility.kt
            app/src/test/java/com/music/zenith/playback/SpatialAudioLearningTest.kt
            app/src/test/java/com/music/zenith/playback/SpatialAudioPreferenceTest.kt
            app/src/test/java/com/music/zenith/playback/SpatialAudioDecisionEngineTest.kt
          )
          for path in "${restore_paths[@]}"; do
            if git cat-file -e "${UPSTREAM_COMMIT}:${path}" 2>/dev/null; then
              git restore --source="${UPSTREAM_COMMIT}" --staged --worktree -- "${path}"
            else
              git rm --cached --ignore-unmatch -- "${path}" >/dev/null 2>&1 || true
              rm -f "${path}"
            fi
          done

      - name: Commit the upstream sync and FC version metadata to main
        if: steps.decision.outputs.should_release == 'true'
        env:
          VERSION_NAME: ${{ steps.decision.outputs.version_name }}
        run: |
          set -euo pipefail
          # The overlay has already been removed from the working tree.
          # A requested main snapshot is one-time; future scheduled syncs return to stable tags.
          TRACK_MODE="$(sed -n 's/^upstreamTrack=//p' fc/version.properties)"
          if [[ "$TRACK_MODE" == "main-once" ]]; then
            sed -i 's/^upstreamTrack=main-once$/upstreamTrack=stable/' fc/version.properties
          fi
          # Stage the real upstream merge plus FC release metadata and the
          # password-protected signing key; ignored build outputs stay excluded.
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(fc): sync upstream and prepare Music v$VERSION_NAME"
          fi
          git push origin HEAD:main

      - name: Publish Music APK to FCZenith Releases
        if: steps.decision.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.decision.outputs.version_name }}
          target_commitish: main
          name: Music v${{ steps.decision.outputs.version_name }}
          body: |
            FC Zenith release: Music v${{ steps.decision.outputs.version_name }}.

            - Android package: com.spotify.music
            - App label: Music
            - Stable upstream baseline: ${{ steps.upstream.outputs.tag }}.
            - Upstream source: ${{ steps.upstream.outputs.source_ref }} at commit ${{ steps.upstream.outputs.commit }}.
            - Includes ${{ steps.upstream.outputs.commits_ahead }} upstream commits beyond the stable baseline when built as a main snapshot.
            - This is an FC-branded upstream-main development snapshot; future automatic syncs return to published stable releases.
            - The same FC signing certificate is checked before publishing.
            - Spatial Audio is unchanged from upstream in this release. FC-specific Auto learning, confidence scoring and output-route changes are deferred to a separate explicitly requested test release.

            Obtainium source: https://github.com/Batmancpu/FCZenith
          files: dist/Music-v${{ steps.decision.outputs.version_name }}.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Retire any legacy one-shot Spatial Audio overlay after successful publication
        if: steps.decision.outputs.should_release == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          overlay="fc/one-shot/spatial-audio"
          [[ -f "$overlay/target-version" ]] || exit 0
          target="$(tr -d '[:space:]' < "$overlay/target-version")"
          asset="Music-v${target}.apk"
          assets="$(gh release view "v${target}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -Fxq "$asset" <<< "$assets"; then
            echo "The exact target APK is not attached; keeping the one-shot overlay for safe retry." >&2
            exit 1
          fi
          rm -rf "$overlay"
          git add -A fc/one-shot/spatial-audio
          if ! git diff --cached --quiet; then
            git commit -m "chore(fc): retire delivered one-shot Spatial Audio overlay"
            git push origin HEAD:main
          fi
