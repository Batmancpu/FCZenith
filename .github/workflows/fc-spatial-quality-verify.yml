name: FC Spatial Audio — isolated quality validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'fc/spatial-audio/experimental/**'
      - 'fc/spatial-audio/apply.py'
      - 'fc/spatial-audio/source-commit'
      - 'fc/spatial-audio/refinement/**'
      - '.github/workflows/fc-sync-release.yml'
      - '.github/workflows/fc-spatial-quality-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc-spatial-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-quality-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout proposed sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Merge real upstream main for forward-compatibility validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/rezapranata089-bit/Zenith.git
          TAG="$(gh api repos/rezapranata089-bit/Zenith/releases/latest --jq '.tag_name')"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream/$TAG"
          git fetch --no-tags upstream "refs/heads/main:refs/remotes/upstream/main"
          STABLE_TARGET="refs/tags/upstream/$TAG^{commit}"
          MAIN_TARGET="refs/remotes/upstream/main"
          if git merge-base --is-ancestor "$STABLE_TARGET" "$MAIN_TARGET"; then
            TARGET="$MAIN_TARGET"
            SOURCE_REF="main"
          elif git merge-base --is-ancestor "$MAIN_TARGET" "$STABLE_TARGET"; then
            TARGET="$STABLE_TARGET"
            SOURCE_REF="tag $TAG (ahead of main)"
          else
            echo "Upstream main and release tag $TAG have diverged; refusing to test arbitrary source." >&2
            exit 1
          fi
          echo "Testing source $SOURCE_REF at $(git rev-parse "$TARGET^{commit}")"
          if ! git merge --no-edit --no-ff -X theirs "$TARGET"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]] || grep -qv '^.github/workflows/' <<< "$conflicts"; then
              echo "Unreviewed upstream conflicts: $conflicts" >&2
              git merge --abort
              exit 1
            fi
            git checkout "$BASE_SHA" -- .github/workflows
            git add -A .github/workflows
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          fi
          # FC owns the release and validation workflows, not upstream.
          git rm -r --ignore-unmatch .github/workflows
          git checkout "$BASE_SHA" -- .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "test: preserve FC-owned workflows"
          fi
          echo "Validated upstream $SOURCE_REF at $(git rev-parse "$TARGET^{commit}")"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install native Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'cmake;3.22.1' 'ndk;27.0.12077973'

      - name: Install icon resizing dependency
        run: python3 -m pip install --user Pillow

      - name: Apply the regular, then experimental, spatial overlays
        shell: bash
        run: |
          set -euo pipefail
          export FC_VERSION_CODE="$(sed -n 's/^versionCode=//p' fc/version.properties)"
          export FC_VERSION_NAME="$(sed -n 's/^versionName=//p' fc/version.properties)"
          python3 fc/apply-overlay.py
          python3 fc/spatial-audio/apply.py
          python3 fc/spatial-audio/experimental/apply.py
          python3 fc/spatial-audio/refinement/apply.py
          python3 fc/branding/apply.py

      - name: Fill missing Android locale fallbacks for this build
        run: |
          python3 - <<'PY'
          import copy
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base_path = Path("app/src/main/res/values/strings.xml")
          base_root = ET.parse(base_path).getroot()
          supported = {"string", "plurals", "string-array"}
          base_entries = {}
          for element in list(base_root):
              name = element.attrib.get("name")
              if (element.tag in supported and name
                      and element.attrib.get("translatable") != "false"):
                  if name in base_entries:
                      raise SystemExit(f"Duplicate base Android resource: {name}")
                  base_entries[name] = element

          for qualifier in ("values-in", "values-ko"):
              locale_path = Path("app/src/main/res") / qualifier / "strings.xml"
              locale_tree = ET.parse(locale_path)
              locale_root = locale_tree.getroot()
              locale_entries = {}
              for element in list(locale_root):
                  name = element.attrib.get("name")
                  if element.tag in supported and name:
                      locale_entries.setdefault(name, []).append(element)

              added = 0
              for name, base_element in base_entries.items():
                  existing = locale_entries.get(name, [])
                  if any(item.attrib.get("translatable") != "false" for item in existing):
                      continue

                  # Replace a locale-specific translatable=false placeholder if one
                  # exists; otherwise append the same English fallback Android
                  # would resolve at runtime. Existing translations are untouched.
                  for item in existing:
                      locale_root.remove(item)
                  locale_root.append(copy.deepcopy(base_element))
                  added += 1

              if added:
                  locale_tree.write(locale_path, encoding="utf-8", xml_declaration=True)
                  ET.parse(locale_path)  # Fail here if generated XML is malformed.
              print(f"{qualifier}: added {added} English fallback entries for this build.")
          PY

      - name: Run all production unit tests, including new audio regressions
        run: |
          set -euo pipefail
          chmod +x gradlew
          FC_VERSION_CODE="$(sed -n 's/^versionCode=//p' fc/version.properties)" \
          FC_VERSION_NAME="$(sed -n 's/^versionName=//p' fc/version.properties)" \
            ./gradlew :app:testProdReleaseUnitTest --no-daemon --stacktrace
