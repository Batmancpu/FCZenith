<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Zenith, a YouTube Music player for Android with an Apple Music-style interface">
  <title>Zenith</title>
  <desc>Animated banner: a drifting liquid mesh gradient behind the Zenith glass icon, with a Dynamic Island style now playing pill.</desc>
  <defs>
    <clipPath id="card"><rect width="960" height="540" rx="28"/></clipPath>
    <clipPath id="iconClip"><rect width="1024" height="1024" rx="230"/></clipPath>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="textShadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.50"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD6E0"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <!-- Icon: same artwork as the launcher icon -->
    <radialGradient id="ibg1" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="724">
      <stop offset="0" stop-color="#FCFBFD"/><stop offset="0.55" stop-color="#F1F0F4"/><stop offset="1" stop-color="#DFDFE8"/>
    </radialGradient>
    <radialGradient id="ibg2" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="760">
      <stop offset="0" stop-color="#707090" stop-opacity="0"/><stop offset="0.6" stop-color="#707090" stop-opacity="0"/><stop offset="1" stop-color="#707090" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="ibg3" gradientUnits="userSpaceOnUse" cx="900" cy="990" r="460">
      <stop offset="0" stop-color="#A9B0D6" stop-opacity="0.3"/><stop offset="1" stop-color="#A9B0D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ipanel" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="834">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="1" stop-color="#B5B9D8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ipanelStroke" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="834">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/><stop offset="1" stop-color="#A9B0D6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="idiag" gradientUnits="userSpaceOnUse" x1="434.3" y1="467.7" x2="635.7" y2="556.3">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="igloss" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="320" y2="470">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ishadow" gradientUnits="userSpaceOnUse" cx="512" cy="740" r="300">
      <stop offset="0" stop-color="#15151F" stop-opacity="0.2"/><stop offset="1" stop-color="#15151F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iglyph" gradientUnits="userSpaceOnUse" x1="63" y1="464" x2="698" y2="20">
      <stop offset="0" stop-color="#030306"/><stop offset="0.35" stop-color="#1A1A20"/><stop offset="0.55" stop-color="#3A3A44"/><stop offset="0.62" stop-color="#25252C"/><stop offset="0.85" stop-color="#7C7C88"/><stop offset="1" stop-color="#B8B8C4"/>
    </linearGradient>
    <linearGradient id="iglyphStroke" gradientUnits="userSpaceOnUse" x1="63" y1="464" x2="698" y2="20">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="540" fill="#0A0A12"/>

    <!-- Liquid mesh gradient -->
    <g filter="url(#blur)">
      <circle cx="170" cy="150" r="230" fill="#FF4D6D" fill-opacity="0.9"><animate attributeName="cx" values="170;330;120;170" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="24s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="150;260;90;150" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="24s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="430" r="190" fill="#FF8A5C" fill-opacity="0.9"><animate attributeName="cx" values="800;640;860;800" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="21s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="430;380;300;430" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="21s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="110" r="250" fill="#7C5CFF" fill-opacity="0.9"><animate attributeName="cx" values="790;620;860;790" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="27s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="110;190;60;110" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="27s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="470" r="200" fill="#36C6FF" fill-opacity="0.8"><animate attributeName="cx" values="190;360;90;190" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="23s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="470;420;500;470" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="23s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="270" r="150" fill="#E040FB" fill-opacity="0.7"><animate attributeName="cx" values="480;560;400;480" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="19s" begin="0s" repeatCount="indefinite"/><animate attributeName="cy" values="270;220;320;270" keyTimes="0;0.333;0.667;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" calcMode="spline" dur="19s" begin="0s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Flowing waves -->
    <path d="M0,440 Q120,406 240,440 T480,440 T720,440 T960,440 T1200,440 T1440,440 T1680,440 T1920,440 V560 H0 Z" fill="#FFFFFF" fill-opacity="0.05"><animateTransform attributeName="transform" type="translate" values="0 0;-960 0" dur="22s" repeatCount="indefinite"/></path>
    <path d="M0,470 Q120,444 240,470 T480,470 T720,470 T960,470 T1200,470 T1440,470 T1680,470 T1920,470 V560 H0 Z" fill="#FFFFFF" fill-opacity="0.07"><animateTransform attributeName="transform" type="translate" values="-960 0;0 0" dur="16s" repeatCount="indefinite"/></path>

    <rect width="960" height="540" fill="url(#scrim)"/>
    <rect width="960" height="540" fill="url(#vignette)"/>

    <!-- Dynamic Island style pill -->
    <g>
      <rect x="421" y="30" width="118" height="44" rx="22" fill="#000" stroke="#FFFFFF" stroke-opacity="0.10">
        <animate attributeName="x" values="421;421;315;315;421;421" keyTimes="0;0.12;0.22;0.78;0.88;1" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" calcMode="spline" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="width" values="118;118;330;330;118;118" keyTimes="0;0.12;0.22;0.78;0.88;1" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1" calcMode="spline" dur="10s" repeatCount="indefinite"/>
      </rect>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.27;0.74;0.8;1" dur="10s" repeatCount="indefinite"/>
        <circle cx="341" cy="52" r="15" fill="url(#cover)"/>
        <circle cx="336" cy="46" r="5" fill="#FFFFFF" fill-opacity="0.35"/>
        <text x="366" y="57.5" font-size="15" font-weight="600" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Now Playing</text>
        <rect x="602" y="49" width="5" height="6" rx="2.5" fill="#FF4D6D"><animate attributeName="height" values="6;18;10;20;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="49;43;47;42;49" dur="1.1s" repeatCount="indefinite"/></rect><rect x="611" y="49" width="5" height="6" rx="2.5" fill="#FF4D6D"><animate attributeName="height" values="16;8;20;10;16" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="44;48;42;47;44" dur="0.9s" repeatCount="indefinite"/></rect><rect x="620" y="49" width="5" height="6" rx="2.5" fill="#FF4D6D"><animate attributeName="height" values="10;20;6;16;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="47;42;49;44;47" dur="1.3s" repeatCount="indefinite"/></rect><rect x="629" y="49" width="5" height="6" rx="2.5" fill="#FF4D6D"><animate attributeName="height" values="18;7;14;20;18" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="43;48.5;45;42;43" dur="1.0s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- Icon glow + shadow -->
    <g>
      <circle cx="480" cy="178" r="118" fill="#FF4D6D" fill-opacity="0.55" filter="url(#soft)">
        <animate attributeName="r" values="112;132;112" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="fill-opacity" values="0.40;0.65;0.40" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <ellipse cx="480" cy="276" rx="78" ry="9" fill="#000" fill-opacity="0.35" filter="url(#soft)">
        <animate attributeName="rx" values="78;70;78" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </ellipse>
    </g>

    <!-- Glass icon -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <g transform="translate(396 94) scale(0.1640625)">
        <g clip-path="url(#iconClip)">
          <rect width="1024" height="1024" fill="url(#ibg1)"/>
          <rect width="1024" height="1024" fill="url(#ibg2)"/>
          <rect width="1024" height="1024" fill="url(#ibg3)"/>
          <path d="M390,190L634,190C750,190 834,274 834,390L834,634C834,750 750,834 634,834L390,834C274,834 190,750 190,634L190,390C190,274 274,190 390,190Z" fill="url(#ipanel)" stroke="url(#ipanelStroke)" stroke-width="5"/>
          <path d="M690,0H830L380,1024H240Z" fill="url(#idiag)"/>
          <path d="M0,0H760C610,150 330,230 0,470Z" fill="url(#igloss)"/>
          <g transform="translate(0 740) scale(1 0.32) translate(0 -740)"><circle cx="512" cy="740" r="300" fill="url(#ishadow)"/></g>
          <g transform="scale(1.40274)">
            <g transform="translate(0 71.3) translate(365 365) scale(0.58) translate(-365 -365)">
              <path d="M163.6,278.8C160,278.2,147.8,283.5,140,287C132.2,290.5,111.7,300.3,98.2,307.9C84.7,315.5,70.1,324.2,59.1,332.5C48.1,340.8,36.9,351.2,29.1,359.7C21.3,368.2,13.3,379.8,9.1,387C4.9,394.2,1.2,404.9,0,409.7C-1.2,414.5,-1.8,419.7,0,424.3C1.8,428.9,11.2,439.8,12.7,441.5C14.2,443.2,18.2,445.2,18.2,445.2C18.2,445.2,9,434.6,8.2,427.9C7.4,421.2,8.3,409.5,12.7,401.5C17.1,393.5,32,374.2,44.5,362.5C57,350.8,80.8,334.5,91.8,327C102.8,319.5,113.8,313.1,125.5,307C137.2,300.9,158.5,293,161.8,290.6C165.1,288.2,167.2,279.4,163.6,278.8ZM588.2,266.1C588.2,266.1,577.9,278.6,571.8,284.3C565.7,290,555.5,298.7,546.4,305.2C537.3,311.7,521.3,322.1,512.7,327C504.1,331.9,495.7,336.2,486.4,339.7C477.1,343.2,430.6,358.2,422.7,360.6C414.8,363,407.3,365,399.1,366.1C390.9,367.2,352.4,372.9,328.2,373.4C304,373.9,221.8,369.7,221.8,369.7C221.8,369.7,249.1,334.2,264.5,317C279.9,299.8,457.3,107,457.3,107C457.3,107,411.7,93.4,394.5,106.1C377.3,118.8,227.2,268.3,195.5,299.7C163.8,331.1,124.8,371,103.6,393.4C82.4,415.8,43.5,459.6,42.7,460.6C41.9,461.6,41.5,464.7,42.7,464.3C43.9,463.9,68.6,450.9,82.7,446.1C96.8,441.3,112.4,436.9,128.2,435.2C144,433.5,163.6,434.3,181.8,435.2C200,436.1,259.9,441.5,280.9,442.5C301.9,443.5,327.7,443.4,342.7,442.5C357.7,441.6,372.1,439.3,386.4,436.1C400.6,432.9,416.3,428,428.2,423.4C440.1,418.8,450.8,413.3,461.8,407C472.8,400.7,489.4,391.8,501.8,381.5C514.2,371.2,537.3,348.2,548.2,335.2C559.1,322.2,570.4,302.3,575.5,293.4C580.6,284.5,588.2,266.1,588.2,266.1ZM709.1,54.3C704.5,50.9,693.6,47.9,693.6,47.9C693.6,47.9,707.2,59.4,710,63.4C712.8,67.4,713.8,73,714.5,77C715.2,81,715.5,84.9,714.5,88.8C713.5,92.7,709.3,104.4,705.5,111.5C701.7,118.6,697.7,125.7,691.8,131.5C685.9,137.3,654.9,165.8,639.1,177C623.3,188.2,592.6,201.1,589.1,204.3C585.6,207.5,596.3,212.4,600.9,211.5C605.5,210.6,622.4,202.4,632.7,196.1C643,189.8,680.2,164.3,687.3,158.8C694.4,153.3,699.7,146.5,705.5,139.7C711.3,132.9,719.7,124.4,723.6,116.1C727.5,107.8,729.1,96.8,729.1,89.7C729.1,82.6,726.9,75.6,723.6,69.7C720.3,63.8,713.7,57.7,709.1,54.3ZM667.3,21.5C667.3,21.5,575.3,36,552,36C528.7,36,498.5,23.4,485,21.2C471.5,19,458.6,18.9,445,18.8C431.4,18.7,415.2,18.5,400,20.6C384.8,22.7,343.5,31.1,328,35.2C312.5,39.3,298,44.4,283.6,51.5C269.2,58.6,227.3,83.8,218.2,89.7C209.1,95.6,197,104.5,193.6,109.7C190.2,114.9,193.4,126.1,193.6,127.9C193.8,129.7,194.7,133.1,196.4,132.5C198.1,131.9,204.9,125.2,210,122.5C215.1,119.8,243.3,104,261.8,97.9C280.3,91.8,309.1,84.4,333.6,81.5C358.2,78.6,392,79.8,409.1,80.6C426.2,81.4,448.5,85.2,459.1,87C469.7,88.8,496.3,85.5,490,94.3C483.7,103.1,293,317.4,291.8,318.8C290.6,320.2,294.6,321.3,296.4,321.5C298.2,321.7,311.5,322.9,319.1,321.5C326.7,320.1,363.2,319.3,380,306.1C396.8,292.9,472.1,210.8,520,163.4C567.9,116,667.3,21.5,667.3,21.5Z" fill="url(#iglyph)" stroke="url(#iglyphStroke)" stroke-width="6" stroke-linejoin="round"/>
            </g>
          </g>
          <!-- Sweeping shine -->
          <g transform="skewX(-20)">
            <rect x="-400" y="-100" width="260" height="1250" fill="url(#shine)">
              <animate attributeName="x" values="-400;-400;1500;1500" keyTimes="0;0.55;0.8;1" dur="7s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
        <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8"/>
      </g>
    </g>

    <!-- Title + tagline -->
    <g filter="url(#textShadow)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="480" y="352" font-size="78" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Zenith</text>
      <text x="480" y="394" font-size="27" font-weight="500" fill="#FFFFFF" fill-opacity="0.88">A YouTube Music player for Android</text>
      <text x="480" y="427" font-size="27" font-weight="500" fill="#FFFFFF" fill-opacity="0.88">with an Apple Music–style interface</text>
    </g>

    <!-- Word-synced feature chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <g><rect x="237" y="458" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"><animate attributeName="fill-opacity" values="0.10;0.26;0.26;0.10;0.10" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="312" y="483" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF" fill-opacity="0.72">Liquid Glass<animate attributeName="fill-opacity" values="0.72;1;1;0.72;0.72" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="0s" repeatCount="indefinite"/></text></g><g><rect x="401" y="458" width="206" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"><animate attributeName="fill-opacity" values="0.10;0.26;0.26;0.10;0.10" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect><text x="504" y="483" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF" fill-opacity="0.72">Word-synced lyrics<animate attributeName="fill-opacity" values="0.72;1;1;0.72;0.72" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="2s" repeatCount="indefinite"/></text></g><g><rect x="621" y="458" width="102" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.18"><animate attributeName="fill-opacity" values="0.10;0.26;0.26;0.10;0.10" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect><text x="672" y="483" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF" fill-opacity="0.72">Automix<animate attributeName="fill-opacity" values="0.72;1;1;0.72;0.72" keyTimes="0;0.08;0.30;0.38;1" dur="6s" begin="4s" repeatCount="indefinite"/></text></g>
    </g>
  </g>
</svg>